<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; frame-src 'self' about:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简译 · 更多设置</title>
<style>
:root{color-scheme:dark;font:14px/1.55 "Segoe UI","Microsoft YaHei UI",sans-serif;--bg:#14151c;--panel:#1c1e28;--raised:#252835;--edge:#383c50;--text:#f2f3fa;--muted:#b6bdd0;--accent:#bdc9ff;--green:#9ce5c2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(14px,5vh,70px) 14px;color:var(--text);background:radial-gradient(ellipse at 50% -35%,#3d4264,transparent 70%),var(--bg)}
main{max-width:1160px;min-height:560px;margin:auto;display:grid;grid-template-columns:182px minmax(0,1fr);border:1px solid var(--edge);border-radius:18px;background:var(--panel);box-shadow:0 26px 90px #05060d70;overflow:hidden}
.sidebar{display:flex;flex-direction:column;gap:24px;padding:18px 11px;background:#171923;border-right:1px solid var(--edge)}
.sidebar .brand{padding:0 8px}
.sidebar .sidebar-footer{padding:0 8px;margin-top:auto;line-height:1.5}
.content{min-width:0}
@media(max-width:650px){main{grid-template-columns:116px minmax(0,1fr);min-height:480px}.sidebar{padding:14px 6px}.sidebar .brand,.sidebar .sidebar-footer{padding:0 5px}}
@media(max-width:420px){body{padding:8px 5px}main{grid-template-columns:102px minmax(0,1fr)}.workspace{padding:10px}.nav button{padding-inline:6px}}

.brand{display:flex;align-items:center;gap:8px;font-weight:700}.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#39405e;color:var(--accent)}
.workspace{padding:clamp(16px,3.8vw,32px)}h1,h2,h3,p{margin:0}h1{font-size:27px;margin-bottom:19px}h2{font-size:17px}h3{font-size:14px}.muted,small{color:var(--muted)}.status{min-height:1.5em;color:var(--green);margin-top:12px}
.grid{display:grid;grid-template-columns:minmax(260px, .9fr) minmax(0,1.5fr);gap:15px;align-items:start}
.card{border:1px solid var(--edge);border-radius:13px;padding:15px;background:var(--raised);min-width:0}.stack{display:grid;gap:11px}
.bar,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.actions{justify-content:flex-end}
button,select,input{font:inherit;color:inherit}button,select,input[type=text]{border:1px solid var(--edge);border-radius:8px;background:#303448;padding:7px 10px;min-width:0}button{cursor:pointer}button:hover{background:#3c435c}button:disabled{cursor:default;opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{width:100%;background:#1a1c26}.primary{background:var(--accent);color:#191f38;border-color:transparent;font-weight:650}.primary:hover{background:#d0daff}.quiet{background:transparent}.small{padding:4px 7px;font-size:12px}
input[type=checkbox],input[type=radio]{accent-color:#aabaff;margin:0}label.field{display:grid;gap:4px;color:var(--muted)}.field[hidden]{display:none}
.library{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--edge)}.library label,.candidate{display:flex;align-items:center;gap:8px;min-width:0}.library strong{font-size:13px}.library small,.candidate small{display:block}
.order{display:flex;gap:4px;flex-shrink:0}.sample{background:#1a1c27;border:1px solid var(--edge);border-radius:9px;padding:11px 12px}.translation{font-size:18px;margin-top:5px;overflow-wrap:anywhere}
.pair{color:var(--accent);font-size:12px}.badge{color:var(--green);font-size:12px}.result{border-top:1px solid var(--edge);padding-top:12px}.result details{margin-top:7px}summary{cursor:pointer;color:var(--accent)}
.adjust{background:#1c1f2a;border:1px solid #4e5982;border-radius:10px;padding:11px}.candidate{border-top:1px solid var(--edge);padding:9px 2px;font-size:14px;cursor:pointer}.candidate span:first-of-type{flex:1}.candidate:has(input:checked){background:#323a55;border-radius:4px}.candidate small{font-size:12px}
dialog{width:min(400px,calc(100% - 32px));border:1px solid var(--edge);border-radius:12px;padding:17px;background:var(--panel);color:var(--text)}dialog::backdrop{background:#080910bf}#name-error{color:#ffd1d6}#name-error:empty{display:none}
@media(max-width:690px){.grid{grid-template-columns:minmax(0,1fr)}.workspace{padding:14px}.card{padding:12px}}
.nav{display:grid;gap:19px;margin:0;padding:0;list-style:none}
.nav-title{display:block;padding:0 8px 5px;color:var(--muted);font-size:12px;font-weight:650}
.nav-children{display:grid;gap:3px;list-style:none;margin:0;padding:0 0 0 7px}
.nav-children button{font-size:13px}
.nav button{display:block;width:100%;text-align:left;background:transparent;border-color:transparent}
.nav button:hover{background:#2c3043}.nav button[aria-current="page"]{background:#363e5c;border-color:#7d8dc6}
.page-heading{margin-bottom:19px}.page-heading h1{margin:0}.page-heading button{white-space:nowrap}
.model-wrap{padding:16px}.model-wrap iframe{display:block;width:100%;height:520px;border:0}.kb-table{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{font-size:13px;padding:9px 5px;border-bottom:1px solid var(--edge);vertical-align:top}.field input{min-width:0}#library-error,#term-error{color:#ffd1d6}#library-error:empty,#term-error:empty{display:none}
.language-label{display:grid;gap:4px;text-align:left;overflow-wrap:anywhere}.language-label small{font-size:12px;font-weight:400}.direction-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.assistant-form{max-width:730px}.assistant-form .bar{align-items:baseline}.assistant-form input[type=file]{max-width:100%}.draft-origin{color:var(--muted);font-size:12px}.inline-error{color:#ffd1d6}
@media(max-width:540px){.direction-columns{grid-template-columns:minmax(0,1fr)}}
textarea{font:inherit;color:inherit;background:#1a1c26;border:1px solid var(--edge);border-radius:8px;padding:8px 10px;width:100%;min-height:92px;resize:vertical}
.language-picks{margin:0;min-width:0;padding:9px 11px 11px;border:1px solid var(--edge);border-radius:8px}.language-picks legend{color:var(--muted)}.language-picks>div{display:flex;gap:9px 15px;flex-wrap:wrap}.language-picks label{display:flex;gap:6px;align-items:center}.draft-direction{min-width:12em}.versions{border-top:1px solid var(--edge);padding-top:10px}.revision{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--edge)}
#history-dialog{width:min(540px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto}.versions{padding-top:0;border-top:0}
.assistant-steps{display:flex;gap:6px 13px;flex-wrap:wrap;padding:0;margin:0 0 13px;list-style:none;font-size:12px;color:var(--muted)}
.assistant-steps [aria-current="step"]{color:var(--accent);font-weight:650}.assistant-context{overflow-wrap:anywhere}.format-help{font-size:12px;color:var(--muted)}.format-help p{margin-top:5px}
#trash-dialog{max-height:calc(100% - 32px);overflow:auto}#trash-choices:empty{display:none}
.trash-options{display:grid;gap:6px;margin-top:5px}.trash-options label{display:flex;align-items:center;gap:8px;padding:6px 0;overflow-wrap:anywhere}
.select-all{display:flex;align-items:center;gap:8px;justify-self:start;cursor:pointer}.combo-select-all{padding-block:1px 3px}
.retention-form{max-width:600px}.retention-row{display:grid;grid-template-columns:minmax(0,1fr) 112px;align-items:center;gap:16px}
.retention-row input{width:100%;border:1px solid var(--edge);border-radius:7px;background:#1a1c26;padding:7px 9px;text-align:center;color:var(--text)}
.retention-card{gap:12px}.retention-card h2{margin-bottom:1px}
.bounded-list{overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior-y:contain}
.bounded-list:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[data-scroll-list] th{position:sticky;top:0;background:var(--raised);z-index:1}
[data-scroll-list="libraries"]{display:grid;gap:11px;min-height:0}

#native-toast:empty{display:none}#native-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:70%;padding:10px 16px;background:#343041;border:1px solid #8e789c;border-radius:9px;z-index:30;white-space:pre-wrap}

.status:empty{display:none}
.sidebar,.content{scrollbar-width:thin;scrollbar-color:#4b5064 transparent}
/* The rounded application surface is the complete native window. */
html,body{height:100%;width:100%;overflow:hidden}
body{padding:0;min-height:0;background:var(--panel)}
body>main{width:100%;height:100%;min-height:0;max-width:none;margin:0;box-shadow:none}
.sidebar{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.content{min-height:0;overflow-y:auto;overflow-x:hidden}

.window-drag-strip{position:fixed;top:1px;left:182px;right:118px;height:24px;z-index:5}

.window-controls{position:fixed;top:10px;right:12px;display:flex;gap:3px;z-index:6;app-region:no-drag;-webkit-app-region:no-drag}
.window-controls button{display:grid;place-items:center;width:30px;height:27px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted);font:18px/1 "Segoe UI",sans-serif;app-region:no-drag}
.window-controls button:hover{background:#ffffff16;color:var(--text)}
.window-controls button[data-window="close"]:hover{background:#b64452;color:white}
.window-resize-edge{position:fixed;z-index:8;app-region:no-drag}
.window-resize-edge[data-edge="n"]{top:0;left:16px;right:16px;height:5px;cursor:n-resize}
.window-resize-edge[data-edge="s"]{bottom:0;left:16px;right:16px;height:5px;cursor:s-resize}
.window-resize-edge[data-edge="w"]{left:0;top:16px;bottom:16px;width:5px;cursor:w-resize}
.window-resize-edge[data-edge="e"]{right:0;top:16px;bottom:16px;width:5px;cursor:e-resize}
.window-resize-edge[data-edge="nw"],.window-resize-edge[data-edge="ne"],.window-resize-edge[data-edge="sw"],.window-resize-edge[data-edge="se"]{width:14px;height:14px}
.window-resize-edge[data-edge="nw"]{top:0;left:0;cursor:nw-resize}.window-resize-edge[data-edge="ne"]{top:0;right:0;cursor:ne-resize}
.window-resize-edge[data-edge="sw"]{bottom:0;left:0;cursor:sw-resize}.window-resize-edge[data-edge="se"]{bottom:0;right:0;cursor:se-resize}
.window-maximized>main{border-radius:0}.window-maximized .window-resize-edge{display:none}

.preference-page textarea{min-height:64px}.preference-page [data-preference-rule]{border-top:1px solid var(--edge);padding-top:12px}.preference-page [data-pref-preview]{flex:1;min-width:0}
.narrow{max-width:760px}.workspace,.model-wrap{padding:28px 30px}.model-wrap iframe{width:100%}.model-wrap{padding-top:28px}.sidebar{gap:17px}.nav{gap:15px}.sidebar-footer{margin-top:auto;text-align:left}.grid{grid-template-columns:minmax(210px,.65fr) minmax(0,1.7fr)}.combo-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:15px}.time-input{display:flex;gap:5px}.time-input select{width:74px}.retention-row{grid-template-columns:minmax(0,1fr) 180px}.more-menu{position:relative}.more-menu>div{position:absolute;right:0;top:28px;z-index:10;display:grid;min-width:130px;padding:7px;background:var(--panel);border:1px solid var(--edge);border-radius:9px}.more-menu button{text-align:left}.more-menu summary{list-style:none;border:1px solid var(--edge);border-radius:8px;padding:6px 10px;color:var(--text)}.bulk-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#343c58;border-radius:8px}.bar>input{flex:1;min-width:140px;width:auto}.preference-rule{padding:12px 0;border-top:1px solid var(--edge)}.preference-rule label{flex:1;min-width:0;overflow-wrap:anywhere}.preference-page textarea{min-height:72px}.draft-filters{justify-content:flex-start}.kb-table input[type=text]{min-width:100px}.kb-table select{min-width:110px}.diff-list{padding:8px 0;font-size:12px}.diff-list li{overflow-wrap:anywhere}#info-dialog{width:min(640px,calc(100% - 32px));max-height:85vh;overflow:auto}#global-task{position:fixed;bottom:16px;right:22px;z-index:20;max-width:calc(100% - 220px);background:#303951;border:1px solid #7386b5;padding:10px 14px;border-radius:10px;box-shadow:0 4px 20px #0005}#global-task .actions{margin-top:5px}#global-task[hidden]{display:none}.field-error{color:#ffd1d6}details.card>summary{font-weight:600}.nav-children button{padding:6px 8px}.model-wrap[hidden]{display:none}
@media(max-width:1050px){.grid,.combo-layout{grid-template-columns:minmax(0,1fr)}.workspace,.model-wrap{padding:25px 18px}.card{padding:13px}.sidebar{gap:16px}.kb-table th,.kb-table td{font-size:12px}}@media(max-width:800px){.sidebar{padding:14px 8px}.nav-title{font-size:11px}.nav-children button{font-size:12px}.retention-row{gap:8px}}
.nav-children[hidden]{display:none}.nav>.nav-title{font-weight:650}.nav-title[aria-expanded="false"]::after{content:' ›';float:right}.nav-title[aria-expanded="true"]::after{content:' ⌄';float:right}.nav>li{min-width:0}.nav>li>.nav-title{color:var(--muted);font-size:12px;font-weight:650;padding:5px 8px}.sidebar .nav-children{padding-left:7px}
.primary small{color:#303958}.combo-layout{align-items:start}.combo-layout>section:first-child{align-content:start}[data-scroll-list="combination-list"]{display:grid;gap:8px}.preference-page{max-width:760px}.sidebar-footer{border:0}
</style>
</head>
<body>
<div class="window-drag-strip" aria-hidden="true"></div>
<div class="window-controls" aria-label="窗口操作">
  <button type="button" data-window="minimize" aria-label="最小化" title="最小化">−</button>
  <button type="button" data-window="maximize" aria-label="最大化" title="最大化">□</button>
  <button type="button" data-window="close" aria-label="关闭更多设置" title="关闭">×</button>
</div>
<div class="window-resize-edge" data-edge="n" aria-hidden="true"></div>
<div class="window-resize-edge" data-edge="s" aria-hidden="true"></div>
<div class="window-resize-edge" data-edge="e" aria-hidden="true"></div>
<div class="window-resize-edge" data-edge="w" aria-hidden="true"></div>
<div class="window-resize-edge" data-edge="nw" aria-hidden="true"></div>
<div class="window-resize-edge" data-edge="ne" aria-hidden="true"></div>
<div class="window-resize-edge" data-edge="sw" aria-hidden="true"></div>
<div class="window-resize-edge" data-edge="se" aria-hidden="true"></div>
<div id="native-toast" role="status" aria-live="polite"></div>
<div id="global-task" role="status" aria-live="polite" hidden></div>
<dialog id="leave-dialog"><form method="dialog" class="stack"><h2>有未保存的更改</h2><div class="actions"><button value="stay" autofocus>继续编辑</button><button value="discard">放弃更改</button><button class="primary" value="save">保存并继续</button></div></form></dialog>
<dialog id="info-dialog"><div class="stack"><div class="bar"><h2 id="info-title"></h2><button type="button" id="close-info">关闭</button></div><div id="info-body"></div></div></dialog>
<main>
<aside class="sidebar">
  <div class="brand"><span class="mark" aria-hidden="true">译</span>简译</div>
  <nav aria-label="简译导航">
    <ul class="nav">
      <li><span class="nav-title" id="translation-nav">翻译设置</span><ul class="nav-children" aria-labelledby="translation-nav">
        <li><button type="button" data-page="translation">语言与翻译方式</button></li>
        <li><button type="button" data-page="capture">取词与识图</button></li>
        <li><button type="button" data-page="retention">结果显示</button></li>
        <li><button type="button" data-page="preferences">翻译偏好</button></li>
      </ul></li>
      <li>
        <span class="nav-title" id="knowledge-nav">知识库</span>
        <ul class="nav-children" aria-labelledby="knowledge-nav">
          <li><button type="button" data-page="knowledge" aria-current="page">知识库管理</button></li>
          <li><button type="button" data-page="combinations">知识库组合</button></li>
          <li><button type="button" data-page="assistant">导入与生成</button></li>
          
          <li><button type="button" data-page="trash">已删除内容</button></li>
        </ul>
      </li>
      <li>
        <span class="nav-title" id="models-nav">模型配置</span>
        <ul class="nav-children" aria-labelledby="models-nav">
          <li><button type="button" data-page="models" data-model="translation">翻译模型</button></li>
          <li><button type="button" data-page="models" data-model="ocr">OCR 模型</button></li>
          <li><button type="button" data-page="models" data-model="assistant">导入助手模型</button></li>
        </ul>
      </li>
      <li><span class="nav-title" id="storage-nav">数据与存储</span><ul class="nav-children" aria-labelledby="storage-nav">
        <li><button type="button" data-page="storage">下载与存储</button></li>
        <li><button type="button" data-page="backup">备份与恢复</button></li>
      </ul></li>
    </ul>
  </nav>
  <button type="button" class="quiet sidebar-footer" id="about-button">帮助与关于</button>
</aside>
<div class="content">
  <section class="workspace" id="app"></section>
  <section class="model-wrap" id="model-wrap" hidden><button type="button" class="quiet" id="model-return" hidden>‹ 返回知识库导入助手</button><iframe id="model-frame" title="模型配置"></iframe></section>
</div>
</main>
<dialog id="preset-dialog" aria-labelledby="name-title">
<form id="preset-form" class="stack">
  <h2 id="name-title">知识库组合名称</h2>
  <label class="field">组合名称<input name="name" type="text" maxlength="28" required autofocus></label>
  <p id="name-error" role="alert"></p>
  <div class="actions"><button type="button" class="quiet" id="cancel-name">取消</button><button class="primary">保存组合</button></div>
</form>
</dialog>
<dialog id="library-dialog" aria-labelledby="library-title">
  <form id="library-form" class="stack">
    <h2 id="library-title">新建知识库</h2>
    <label class="field">知识库名称<input type="text" name="name" maxlength="32" required autofocus></label><label class="field" id="library-kind-field">语言分类<select name="kind"><option value="pair">双向语言对</option><option value="mixed">综合（多语言）</option></select></label>
    <label class="select-all"><input type="checkbox" name="personal">个人常用词库</label><label class="field" id="library-direction-field">语言对<select name="direction"></select></label><p id="library-error" role="alert"></p>
    <div class="actions"><button type="button" class="quiet" data-close="library-dialog">取消</button><button class="primary">保存</button></div>
  </form>
</dialog>
<dialog id="term-dialog" aria-labelledby="term-title">
  <form id="term-form" class="stack">
    <h2 id="term-title">新增术语</h2>
    <label class="field">原词或短语<input type="text" name="source" maxlength="120" required autofocus></label>
    <label class="field">指定译法<input type="text" name="target" maxlength="120" required></label>
    <label class="field">翻译方向<select name="direction"></select></label>
    <label><input type="checkbox" name="enabled"> 启用词条</label><label class="field">备注<textarea name="note" maxlength="1000"></textarea></label><p id="term-error" role="alert"></p>
    <div class="actions"><button type="button" class="quiet" data-close="term-dialog">取消</button><button class="primary">保存术语</button></div>
  </form>
</dialog>
<dialog id="history-dialog" aria-labelledby="history-title">
  <div class="stack"><div class="bar"><div><h2 id="history-title">版本记录</h2><small id="history-library"></small></div><button type="button" id="history-close" class="quiet" data-close="history-dialog" autofocus>关闭</button></div>
    <div id="history-body"></div><p id="history-status" role="status"></p>
  </div>
</dialog>
<dialog id="restore-dialog" aria-labelledby="restore-title">
  <form id="restore-form" class="stack">
    <h2 id="restore-title">恢复词条版本</h2><p id="restore-summary"></p>
    <div class="actions"><button type="button" class="quiet" data-close="restore-dialog">取消</button><button class="primary">确认恢复</button></div>
  </form>
</dialog>
<dialog id="trash-dialog" aria-labelledby="trash-title">
  <form id="trash-confirm" class="stack">
    <h2 id="trash-title"></h2><p id="trash-message"></p><div id="trash-choices"></div>
    <div id="trash-actions" class="actions"></div>
  </form>
</dialog>
<script>

const pendingNative=new Map();let nativeRevision=0,nativeSaved={libraries:[],presets:[],active:null,trashSchema:1},nativeBusy=true,readyModels=null;
window.nativeCall=(action,data={})=>new Promise((resolve,reject)=>{
 const id=crypto.randomUUID();pendingNative.set(id,{resolve,reject});
 chrome.webview.postMessage({id,action,data});
});
chrome.webview.addEventListener('message',event=>{
 const value=event.data;
 if(value.type==='window-state'){
   document.body.classList.toggle('window-maximized',value.maximized);
   const button=document.querySelector('[data-window="maximize"]');
   button.textContent=value.maximized?'❐':'□';button.title=button.ariaLabel=value.maximized?'还原':'最大化';return;
 }
 if(value.type==='model-progress'){if(task?.active)showGlobalTask(value.message);document.querySelector('#model-frame')?.contentWindow.showNativeProgress?.(value.message);return;}
 if(value.type==='translation-selection'){
   readyModels=value.state;document.querySelector('#model-frame').contentWindow.syncNativeModels?.(readyModels,true);return;
 }
 const pending=pendingNative.get(value.id);if(!pending)return;
 pendingNative.delete(value.id);value.ok?pending.resolve(value.value):pending.reject(Error(value.value||'操作失败。'));
});
for(const name of ['click','change','submit','keydown'])document.addEventListener(name,event=>{
 if(event.target.closest?.('.window-controls,.window-resize-edge'))return;
 if(!nativeBusy)return;
 event.preventDefault();event.stopImmediatePropagation();

// Window dragging uses a movement threshold so clicks keep their original action.
function attachWindowDragging(doc){
 let gesture=null,frame=0,suppressClick=false;
 const excluded='input,textarea,select,[contenteditable]:not([contenteditable="false"]),.window-resize-edge';
 doc.addEventListener('pointerdown',event=>{
   suppressClick=false;
   if(event.button!==0||!event.isPrimary||event.target.closest(excluded))return;
   gesture={id:event.pointerId,x:event.screenX,y:event.screenY,target:event.target,moved:false};
   const bounds=doc.defaultView.frameElement?.getBoundingClientRect();
   nativeCall('window',{command:'drag-start',x:event.clientX+(bounds?.left||0),y:event.clientY+(bounds?.top||0)});
 },true);
 doc.addEventListener('pointermove',event=>{
   if(!gesture||event.pointerId!==gesture.id)return;
   if(!gesture.moved){
     if(Math.hypot(event.screenX-gesture.x,event.screenY-gesture.y)<6)return;
     gesture.moved=true;suppressClick=true;
     doc.defaultView.getSelection()?.removeAllRanges();
     gesture.target.setPointerCapture(event.pointerId);
   }
   event.preventDefault();
   if(!frame)frame=doc.defaultView.requestAnimationFrame(()=>{frame=0;if(gesture?.moved)nativeCall('window',{command:'drag-move'});});
 },true);
 const end=event=>{
   if(!gesture||event.pointerId!==gesture.id)return;
   if(frame){doc.defaultView.cancelAnimationFrame(frame);frame=0;}
   if(gesture.moved){event.preventDefault();nativeCall('window',{command:'drag-move'});}
   gesture=null;nativeCall('window',{command:'drag-end'});
 };
 doc.addEventListener('pointerup',end,true);
 doc.addEventListener('pointercancel',end,true);
 doc.addEventListener('lostpointercapture',end,true);
 doc.addEventListener('selectstart',event=>{if(gesture&&!event.target.closest(excluded))event.preventDefault();},true);
 doc.addEventListener('dragstart',event=>{if(gesture)event.preventDefault();},true);
 doc.addEventListener('click',event=>{if(suppressClick){suppressClick=false;event.preventDefault();event.stopImmediatePropagation();}},true);
}

function entryKey(entry,library){return (entryDirection(entry,library)||'')+'|'+normalize(entry.source);}
function prepareDraft(library,entries,origin){
 const known=new Map(library.terms.map(entry=>[entryKey(entry,library),entry])),batch=new Set();
 const rows=entries.map(entry=>{
   const existing=known.get(entryKey(entry,library));let problem='',status='new',resolution=existing?entry.resolution:undefined;
   if(typeof entry.source!=='string'||typeof entry.target!=='string'||!entry.source.trim()||!entry.target.trim()||entry.source.length>200||entry.target.length>500)problem='原词或译法为空或过长';
   else if(!directions.includes(entry.direction))problem='请选择方向';
   else if(!allowedDirections(library).includes(entry.direction))problem='与目标库语言不符';
   else if(batch.has(entryKey(entry,library)))problem='本批次重复原词';
   if(problem)status='invalid';
   else if(existing){status=existing.target===entry.target?'duplicate':'conflict';resolution=resolution||'skip';}
   batch.add(entryKey(entry,library));
   return {...entry,existing,status,resolution,problem,included:status==='new'?(entry.status&&entry.status!=='new'?true:entry.included??true):status==='conflict'&&resolution==='update'?(entry.included??true):false};
 });
 ui.draft={libraryId:library.id,origin,rows};
}
async function suggestImportLanguages(entries){
 const missing=entries.map((entry,index)=>({...entry,index})).filter(entry=>!directions.includes(entry.direction)&&!entry.invalidLanguage);
 if(!missing.length||!ui.assistantReady||missing.length>200)return entries;
 const reply=await nativeCall('assistant',{task:'detect_languages',entries:missing.map(entry=>({index:entry.index,source:entry.source,target:entry.target}))});
 const suggestions=new Map((reply.entries||[]).map(entry=>[entry.index,entry]));
 return entries.map((entry,index)=>{
   if(directions.includes(entry.direction)||entry.invalidLanguage)return entry;
   const suggestion=suggestions.get(index),direction=suggestion?.source_lang+'>'+suggestion?.target_lang;
   return directions.includes(direction)?{...entry,direction,languageOrigin:'助手建议 · 请核对'}:entry;
 });
}
function buildGenerationRequest(library,data){

  const requested=[pair,reverseDirection(pair)];
  if(requested.some(direction=>!allowedDirections(library).includes(direction)))throw Error('所选语言与目标库不符。');
  return {task:'generate_terminology',topic,details,allowed_pairs:requested,rules:generationRules,schema_version:1};
}

function parseDelimited(text,delimiter){
  const records=[];
  let cells=[],field='',quoted=false,closedQuote=false,line=1,start=1;
  text=text.replace(/\r\n?/g,'\n');
  for(let index=0;index<=text.length;index++){
    const char=text[index]??'\n';
    if(quoted){
      if(index===text.length)throw Error('第 '+start+' 行的引号未闭合。');
      if(char==='"'){
        if(text[index+1]==='"'){field+='"';index++;}
        else{quoted=false;closedQuote=true;}
      }else{field+=char;if(char==='\n')line++;}
    }else if(char===delimiter||char==='\n'){
      cells.push(field.trim());field='';closedQuote=false;
      if(char==='\n'){
        if(cells.some(Boolean))records.push({cells,line:start});
        cells=[];line++;start=line;
      }
    }else if(char==='"'&&!field&&!closedQuote){quoted=true;}
    else if(closedQuote||char==='"')throw Error('第 '+start+' 行的引号格式无效。');
    else field+=char;
  }
  return records;
}
function parseGlossary(text,extension,name){
  const records=parseDelimited(text,extension==='tsv'?'\t':',');
  const headings=records.shift()?.cells.map(cell=>cell.toLowerCase())||[];
  const source=headings.indexOf('term'),target=headings.indexOf('translation');
  const from=headings.indexOf('source_lang'),to=headings.indexOf('target_lang');
  if(source<0||target<0||new Set(headings).size!==headings.length)throw Error('表头须包含唯一的 term 和 translation 列。');
  if((from===-1)!==(to===-1))throw Error('语言列须同时提供 source_lang 和 target_lang。');
  if(!records.length||records.length>5000)throw Error('词表须包含 1 至 5000 条。');
  const codes=Object.keys(languageLabels);
  const languageCode=value=>codes.find(code=>code.toLowerCase()===(value||'').toLowerCase())||'';
  return records.map(({cells,line})=>{
    const escaped=headings.includes('jianyi_escaped_fields')?(cells[headings.indexOf('jianyi_escaped_fields')]||'').split(';'):[];
    const literal=(name,index)=>{const value=cells[index]||'';return escaped.includes(name)&&value.startsWith("'")?value.slice(1):value;};
    const fromText=from>=0?cells[from]||'':'',toText=to>=0?cells[to]||'':'';
    const sourceCode=languageCode(fromText),targetCode=languageCode(toText);
    return {
      source:literal('term',source),target:literal('translation',target),note:headings.includes('note')?literal('note',headings.indexOf('note')):'',sourceCode,targetCode,
      invalidLanguage:Boolean((fromText&&!sourceCode)||(toText&&!targetCode)),
      direction:sourceCode&&targetCode?sourceCode+'>'+targetCode:'',
      reference:headings.includes('reference')?literal('reference',headings.indexOf('reference'))||name+' · 第 '+line+' 行':name+' · 第 '+line+' 行',
      enabled:headings.includes('enabled')?cells[headings.indexOf('enabled')]!=='false':true
    };
  });
}
async function saveDraft(){
 if(!ui.draft)return false;const draft=structuredClone(ui.draft),library=byId(draft.libraryId);
 if(!library||library.deletedAt){ui.note='目标知识库已删除，请重新选择保存位置。';render();return false;}

 const picked=ui.draft.rows.filter(row=>row.included&&!row.problem&&row.status!=='duplicate'&&row.resolution!=='skip');
 if(!picked.length){ui.note='请勾选通过核对的条目。';render();return false;}
 const versions=history(library);
 for(const row of picked){
   const entry={source:row.source.trim(),target:row.target.trim(),direction:row.direction,reference:row.reference||'',note:row.note||'',origin:draft.origin,enabled:row.enabled!==false};
   const index=library.terms.findIndex(item=>entryKey(item,library)===entryKey(entry,library));
   if(index<0)library.terms.push(entry);else library.terms[index]={...library.terms[index],...entry,edited:true};
 }
 recordVersion(library,versions,draft.origin==='generated'?'保存生成术语':'导入词表',picked.length);
 if(!await persist('已保存 '+picked.length+' 条，并记录版本。')){ui.draft=draft;render();return false;}
 ui.draft=null;ui.filter='all';ui.assistantStep='setup';ui.importFile=null;render();return true;
}

function deleteMessage(library,permanent,ids){
  const type=library?'知识库':'组合';
  const intro=permanent?'所选'+type+'将无法恢复。':'所选'+type+'将移到「已删除内容」，之后可以恢复。';
  if(!library)return intro+' 组合里的知识库可继续独立使用。';
  const linked=model.presets.filter(combo=>ids.some(id=>combo.ids.includes(id)||ui.comboDrafts.get(combo.id)?.ids.includes(id)));
  const context=linked.length?' 影响组合：'+linked.map(item=>item.name+(item.deletedAt?'（已删除）':'')).join('、')+'。':'';
  return intro+context+(permanent?' 词条、版本记录和组合引用会一起清除。':' 删除期间停止调用这些知识库。');
}
function deleteRecords(library,permanent,ids){
  const records=library?model.libraries:model.presets,type=library?'知识库':'组合';
  const selected=records.filter(item=>ids.includes(item.id)&&Boolean(item.deletedAt)===permanent);
  if(!selected.length)return;
  const targets=new Set(selected.map(item=>item.id));
  if(permanent){
    if(library){
      model.libraries=records.filter(item=>!targets.has(item.id));
      for(const combo of [...model.presets,...ui.comboDrafts.values()])combo.ids=combo.ids.filter(id=>!targets.has(id));
    }else model.presets=records.filter(item=>!targets.has(item.id));
  }else{
    const now=new Date().toISOString();
    for(const item of selected)item.deletedAt=now;
  }
  if(library&&targets.has(ui.draft?.libraryId))ui.draft=null;
  if(!library)for(const id of targets)ui.comboDrafts.delete(id);
  finishTrash((permanent?'已彻底删除 ':'已删除 ')+targets.size+' 个'+type+'。');
}
function batchDelete(library,permanent){
  const records=library?model.libraries:model.presets;
  const items=records.filter(item=>Boolean(item.deletedAt)===permanent);
  const type=library?'知识库':'组合';
  if(!items.length)return;
  trashPrompt((permanent?'批量彻底删除':'批量删除')+type,
    ids=>ids.length?deleteMessage(library,permanent,ids):'勾选要删除的'+type+'。',
    permanent?'彻底删除所选':'删除所选',
    ids=>deleteRecords(library,permanent,ids),{items,requireSelection:true});
}
function handleTrash(action,id){
  const library=action.endsWith('library');
  const records=library?model.libraries:model.presets;
  const item=records.find(entry=>entry.id===id);
  if(!item)return;
  const type=library?'知识库':'组合';
  const name='「'+item.name+'」';
  if(action.startsWith('restore')){
    if(!item.deletedAt)return;
    const children=library?[]:item.ids.map(byId).filter(entry=>entry?.deletedAt);
    const restore=selected=>{
      for(const entry of children)if(selected.includes(entry.id))delete entry.deletedAt;
      if(!library)item.ids=item.ids.filter(entry=>byId(entry));
      delete item.deletedAt;
      finishTrash('已恢复'+type+name+'。');
    };
    if(children.length){
      trashPrompt('恢复知识库组合',ids=>'选择随组合'+name+'一起恢复的知识库。'+(ids.length?'':'当前只恢复组合。'),
        '确认恢复',restore,{items:children,selected:true});
    }else restore([]);
    return;
  }
  const permanent=action.startsWith('purge');
  if(Boolean(item.deletedAt)!==permanent)return;
  const verb=permanent?'彻底删除':'删除';
  trashPrompt(verb+type,name+'。'+deleteMessage(library,permanent,[id]),verb,()=>deleteRecords(library,permanent,[id]));
}

let listSizeObserver;
function fitGrowingLists(root){
  listSizeObserver?.disconnect();
  const lists=[...root.querySelectorAll('[data-scroll-list]')];
  function size(list){
    const items=[...list.querySelectorAll(list.dataset.scrollItems||':scope > *')];
    const active=items.length>5;
    list.classList.toggle('bounded-list',active);
    if(!active){list.style.removeProperty('max-height');list.removeAttribute('tabindex');return;}
    const gap=parseFloat(getComputedStyle(list).rowGap)||0;
    const header=list.querySelector('thead')?.offsetHeight||0;
    const height=header+items.slice(0,5).reduce((total,item)=>total+item.getBoundingClientRect().height,0)+gap*4;
    list.style.maxHeight=Math.ceil(height)+'px';
    list.tabIndex=0;
  }
  listSizeObserver=new ResizeObserver(()=>lists.forEach(size));
  for(const list of lists){
    size(list);
    const items=[...list.querySelectorAll(list.dataset.scrollItems||':scope > *')].slice(0,5);
    for(const item of items)listSizeObserver.observe(item);
    if(list.querySelector('thead'))listSizeObserver.observe(list.querySelector('thead'));
  }
}

app.addEventListener('click',async event=>{
  const target=event.target.closest('button[data-action]');
  if(!target)return;
  const {action,value}=target.dataset;
  if(action==='reset-retention'){Object.assign(retentionDraft,retentionDefaults);render();return;}
  if(action==='import-document'){
    if(!ui.assistantReady){ui.note='导入助手模型未配置。';render();return;}
    try{
      const entries=await nativeCall('import-knowledge-document',{direction:document.getElementById('document-direction').value});
      if(entries){prepareDraft(byId(ui.library),entries,'imported');ui.assistantStep='review';ui.note='';render();}
    }catch(error){ui.note=error.message;render();}return;
  }

  if(['batch-library','batch-combo','batch-purge-library','batch-purge-combo'].includes(action)){
    batchDelete(action.endsWith('library'),action.includes('purge'));return;
  }
  if(['trash-library','trash-combo','purge-library','purge-combo','restore-library','restore-combo'].includes(action)){handleTrash(action,value);return;}
  if(action==='assistant-create'){openLibraryDialog(false,true);return;}
  if(action==='view-library'){ui.selectedTerms.clear();ui.library=value;ui.note='';render('[data-action="view-library"][data-value="'+value+'"]');return;}
  if(action==='open-helper'){importRun++;if(!ui.draft)ui.assistantStep='setup';openPage('assistant');return;}
  if(action==='assistant-config'){
    ui.helperBack=true;ui.modelPage='assistant';unguardedOpenPage('models');requestModelPage();return;
  }
  if(action==='assistant-next'||action==='assistant-back'){
    importRun++;
    ui.assistantStep=action==='assistant-next'||ui.assistantStep==='review'?'input':'setup';
    ui.note='';render('#assistant-step-title');return;
  }
  if(action==='retry-language'&&ui.draft&&ui.assistantReady){
    const {rows,origin,libraryId}=ui.draft;
    const entries=await suggestImportLanguages(rows);
    prepareDraft(byId(libraryId),entries,origin);
    ui.note='已重新检查未确认的方向。';render();return;
  }
  if(action==='discard-draft'){ui.draft=null;ui.assistantStep='input';ui.note='';render();return;}
  if(action==='save-draft'){saveDraft();return;}
  if(action==='view-versions'){openHistory();return;}
  if(action==='new-library'||action==='rename-library'){
    openLibraryDialog(action==='rename-library',false);return;
  }
  if(action==='edit-term'){
    ui.termIndex=Number(value);
    const entry=byId(ui.library).terms[ui.termIndex];
    termForm.elements.source.value=entry?.source||'';
    termForm.elements.target.value=entry?.target||'';
    termForm.elements.note.value=entry?.note||'';
    termForm.elements.enabled.checked=entry?.enabled??true;
    const library=byId(ui.library);
    termForm.elements.direction.innerHTML=directionOptions(allowedDirections(library),entry?entryDirection(entry,library):(directions.includes(ui.filter)?ui.filter:library.direction));
    document.querySelector('#term-title').textContent=entry?'编辑术语':'新增术语';
    document.querySelector('#term-error').textContent='';
    termDialog.showModal();
    return;
  }
  const current=editablePreset();
  if(action==='save-combination'){
    const saved=preset();
    if(!comboDirty(saved,current))return;
    if(model.presets.some(item=>item.id!==saved.id&&item.name===current.name)){
      ui.note='已有同名组合，请重新命名。';render();return;
    }
    await saveCurrentCombination();return;
  }
  if(action==='new'||action==='rename'){
    if(action==='new'&&pageDirty()&&!await guardNavigation())return;
    ui.newEmpty=action==='new'&&value==='empty';
    ui.naming=action;
    form.elements.name.value=action==='rename'?current.name:'';
    document.querySelector('#name-title').textContent=action==='rename'?'重命名组合':'另存知识库组合';
    document.querySelector('#name-error').textContent='';
    form.querySelector('button.primary').textContent=action==='rename'?'确认名称':'保存新组合';
    dialog.showModal();
    return;
  }
  if(action==='up'||action==='down'){
    const index=current.ids.indexOf(value);
    const enabled=ordered(current).map(item=>item.id);
    const other=current.ids.indexOf(enabled[enabled.indexOf(value)+(action==='up'?-1:1)]);
    if(other<0)return;
    [current.ids[index],current.ids[other]]=[current.ids[other],current.ids[index]];
    ui.note='';render('input[value="'+value+'"]');return;
  }
});

document.getElementById('info-body').addEventListener('click',event=>{const node=event.target.closest('[data-action="about-models"]');if(node){document.getElementById('info-dialog').close();openNativePage('models/'+node.dataset.value);}});
function changeRows(before,after,library){
 const a=new Map(before.map(row=>[entryKey(row,library),row])),b=new Map(after.map(row=>[entryKey(row,library),row]));
 return [...b].filter(([key,row])=>!a.has(key)||JSON.stringify([a.get(key).target,a.get(key).enabled,a.get(key).note||''])!==JSON.stringify([row.target,row.enabled,row.note||''])).map(([key,row])=>({type:a.has(key)?'修改':'新增',source:row.source,before:a.get(key)?.target||'',after:row.target}))
 .concat([...a].filter(([key])=>!b.has(key)).map(([,row])=>({type:'删除',source:row.source,before:row.target,after:''})));
}
function diffSummary(before,after,library){const changes=changeRows(before,after,library);return ['新增','修改','删除'].map(type=>type+' '+changes.filter(row=>row.type===type).length+' 条').join(' · ');}
function versionDiff(before,after,library){
 const changes=changeRows(before,after,library);
 return '<details class="diff-list"><summary>'+esc(diffSummary(before,after,library))+'</summary><ul>'+changes.slice(0,50).map(row=>'<li>'+esc(row.type+' · '+row.source+'：'+row.before+(row.before&&row.after?' → ':'')+row.after)+'</li>').join('')+'</ul>'+(changes.length>50?'<small>仅显示前 50 项，可导出知识库核对完整内容。</small>':'')+'</details>';
}
function pageDirty(){
 if(document.querySelector('dialog[open] form[data-dirty="true"]'))return true;
 if(ui.page==='preferences')return preferenceDirty||preferencePreview.length>0;
 if(ui.page==='combinations')return [...ui.comboDrafts].some(([id])=>{const row=model.presets.find(row=>row.id===id);return row&&comboDirty(row);});
 if(ui.page==='retention')return JSON.stringify(retentionDraft)!==JSON.stringify(savedRetention);
 if(ui.page==='translation'||ui.page==='capture')return basicDirty;
 if(ui.page==='assistant')return !!ui.draft;
 if(ui.page==='models')return !!frame.contentWindow.hasModelDraft?.();
 return false;
}
async function saveCurrentCombination(){
 const saved=preset(),draft=editablePreset();if(!saved||!comboDirty(saved,draft))return true;
 if(model.presets.some(row=>row.id!==saved.id&&row.name===draft.name)){ui.note='已有同名组合';render();return false;}
 const pending=structuredClone(draft);Object.assign(saved,{name:draft.name,mode:draft.mode,ids:[...draft.ids]});
 if(!await persist('已保存组合「'+saved.name+'」。'))return false;
 ui.comboDrafts.delete(saved.id);render();return true;
}
async function discardPageDraft(){
 const modal=document.querySelector('dialog[open] form[data-dirty="true"]');if(modal){delete modal.dataset.dirty;modal.closest('dialog').close();}
 if(ui.page==='preferences'){preferenceState=await nativeCall('preferences');preferenceDirty=false;preferencePreview=[];}
 if(ui.page==='retention')Object.assign(retentionDraft,savedRetention);
 if(ui.page==='combinations')ui.comboDrafts.clear();
 if(ui.page==='models')frame.contentWindow.discardModelDraft?.();
 if(ui.page==='translation'||ui.page==='capture'){basicSettings={...basicSaved};basicDirty=false;}
 if(ui.page==='assistant'){ui.draft=null;ui.importFile=null;ui.assistantStep='setup';}
}
async function savePageDraft(){
 try{
  const modal=document.querySelector('dialog[open] form[data-dirty="true"]');
  if(modal){if(!modal.checkValidity()){modal.reportValidity();return false;}const dialog=modal.closest('dialog');modal.requestSubmit();for(let i=0;i<100;i++){await new Promise(r=>setTimeout(r,20));if(!dialog.isConnected||!dialog.open)return pageDirty()?await savePageDraft():true;}return false;}
  if(ui.page==='preferences'){if(preferencePreview.length){nativeToast('请先确认或丢弃示例提取结果');return false;}await persistPreferences();return !preferenceDirty;}
  if(ui.page==='combinations')return await saveCurrentCombination();
  if(ui.page==='retention'){await commitRetention({...retentionDraft});return JSON.stringify(retentionDraft)===JSON.stringify(savedRetention);}
  if(ui.page==='models')return !!await frame.contentWindow.saveModelDraft?.();
  if(ui.page==='assistant')return await saveDraft();
  if(basicDirty){basicSettings=await nativeCall('basic-settings',{values:basicSettings});basicSaved={...basicSettings};basicDirty=false;return true;}
  return true;
 }catch(error){nativeToast(error.message);return false;}
}
async function guardNavigation(){
 if(!pageDirty())return true;if(leaveDialog.open)return false;
 leaveDialog.returnValue='stay';leaveDialog.showModal();
 const result=await new Promise(resolve=>leaveDialog.addEventListener('close',()=>resolve(leaveDialog.returnValue),{once:true}));
 if(result==='discard'){await discardPageDraft();return true;}
 if(result==='save')return await savePageDraft();return false;
}
window.requestCloseSettings=async()=>{if(await guardNavigation())await nativeCall('window',{command:'close',confirmed:true});};
document.querySelector('.window-controls').addEventListener('click',event=>{if(event.target.closest('[data-window="close"]')){event.stopImmediatePropagation();event.preventDefault();requestCloseSettings();}},true);
document.querySelector('.nav').addEventListener('click',event=>{
 const tab=event.target.closest('[data-page]');if(!tab||!pageDirty())return;
 event.stopImmediatePropagation();event.preventDefault();
 guardNavigation().then(ok=>{if(!ok)return;if(tab.dataset.model)ui.modelPage=tab.dataset.model;openPage(tab.dataset.page);if(tab.dataset.model)requestModelPage();});
},true);
async function requestCombo(id){if(id===preset()?.id)return;if(!await guardNavigation())return;ui.editCombo=id;render();}
function basicView(){
 if(ui.page==='translation')return pageHeading('语言与翻译方式')+'<section class="card stack narrow"><h2>'+esc((readyModels?.mode==='mt'?'本地翻译':readyModels?.mode==='llm'?'LLM · 本机':'LLM · 远程 API'))+'</h2><div class="bar"><strong>'+esc((languageLabels[readyModels?.source]||'自动识别')+' → '+(languageLabels[readyModels?.target]||'简体中文'))+'</strong>'+button('更改','translation-config','','primary')+'</div></section>';
 const checkbox=(key,label)=>'<label class="select-all"><input type="checkbox" data-basic="'+key+'" '+(basicSettings[key]?'checked':'')+'>'+label+'</label>';
 return pageHeading('取词与识图')+'<form id="basic-form" class="card stack narrow">'+checkbox('ocrEnabled','自动识图（OCR）')+checkbox('clipboardFallback','使用剪贴板读取选区')+checkbox('offlineMode','仅使用本机功能')+'<label class="retention-row"><span>选中后等待时间（毫秒）</span><input type="number" data-basic="dwellMs" min="200" max="1000" value="'+basicSettings.dwellMs+'" required></label><div class="actions">'+button('取消更改','cancel-basic','','quiet')+'<button class="primary">保存</button></div></form>';
}
function formatBytes(bytes){if(!Number.isFinite(bytes))return '未读取';return bytes>=1073741824?(bytes/1073741824).toFixed(2)+' GiB':(bytes/1048576).toFixed(1)+' MiB';}
function storageView(){
 const state=storageState;
 return pageHeading('下载与存储')+'<div class="stack narrow"><section class="card stack"><h2>后续下载位置</h2><p class="file-name">'+esc(readyModels?.downloadDirectory||'')+'</p><div class="actions">'+button('更改位置','storage-directory','','quiet')+button('恢复默认','storage-reset','','quiet')+'</div></section><section class="card stack"><div class="bar"><h2>当前目录占用</h2>'+button('刷新','storage-refresh','','small quiet')+'</div>'
 +(state?'<strong>'+formatBytes(state.totalBytes)+' · 磁盘剩余 '+formatBytes(state.freeBytes)+'</strong><div class="stack">'+state.groups.map(row=>'<div class="bar"><span>'+esc(row.name)+'</span><span>'+formatBytes(row.bytes)+'</span></div>').join('')+'</div>':'<p class="muted">点击刷新读取</p>')+'<div class="actions">'+button('清理未完成下载','storage-clean','','quiet')+button('迁移已有模型','storage-migrate','','quiet')+'</div></section></div>';
}
function backupView(){return pageHeading('备份与恢复')+'<div class="stack narrow"><section class="card stack"><h2>用户数据</h2><div class="actions">'+button('导出备份','export-backup','','primary')+button('选择备份恢复','preview-backup','','quiet')+'</div></section>'+(backupPreview?'<section class="card stack"><h2>恢复预览</h2><p>'+esc(backupPreview.name)+'</p><p>'+backupPreview.libraries+' 个知识库 · '+backupPreview.presets+' 个组合 · '+backupPreview.preferences+' 条偏好</p><p>恢复前将保存当前数据的恢复点</p><div class="actions">'+button('取消','cancel-backup','','quiet')+button('确认恢复','restore-backup','','primary')+'</div></section>':'')+'</div>';}
let task=null,taskTimer;
function showGlobalTask(message){if(!task)task={label:'正在处理',action:null};task.message=message;renderGlobalTask();}
function renderGlobalTask(){
 const node=document.getElementById('global-task');node.hidden=!task;if(!task)return;
 node.innerHTML='<strong>'+esc(task.label)+'</strong><div>'+esc(task.message||'')+'</div><div class="actions">'+(task.active?'<button type="button" data-task="cancel">取消</button>':(task.action?'<button type="button" data-task="retry">重试</button>':'')+'<button type="button" data-task="dismiss">关闭</button>')+'</div>';
}
const originalNativeCall=window.nativeCall;
const longActions={'download-model':'下载本机模型','download-languages':'配置离线语言','download-ocr':'下载 OCR 模型','download-runtime':'下载运行组件','import-model':'导入模型','retry-model-import':'重试导入','migrate-models':'迁移模型','export-backup':'导出备份','restore-backup':'恢复数据','model-list':'读取模型列表','check-model':'检测模型'};
window.nativeCall=async(action,data={})=>{
 const label=longActions[action];
 if(task?.active&&label)throw Error('请先完成或取消当前任务');
 if(label){clearTimeout(taskTimer);task={label,action,data,active:true,message:'正在准备…'};renderGlobalTask();}
 try{const result=await originalNativeCall(action,data);if(label){task={label,message:'已完成'};renderGlobalTask();taskTimer=setTimeout(()=>{task=null;renderGlobalTask();},3000);}return result;}
 catch(error){if(label){task={label,action,data,active:false,message:error.message};renderGlobalTask();}throw error;}
};
document.getElementById('global-task').addEventListener('click',event=>{const action=event.target.dataset.task;if(action==='cancel')nativeCall('cancel');if(action==='dismiss'){task=null;renderGlobalTask();}if(action==='retry'&&task?.action){const {action,data}=task;nativeCall(action,data).then(result=>{if(result?.configs){readyModels=result;frame.contentWindow.syncNativeModels?.(result);}}).catch(error=>nativeToast(error.message));}});
async function refreshStorage(){storageState=await nativeCall('storage-state');render();}
app.addEventListener('input',event=>{
 const node=event.target;
 for(const [id,key] of [['library-search','librarySearch'],['trash-search','trashSearch']])if(node.id===id){ui[key]=node.value;const pos=node.selectionStart;render('#'+id);document.getElementById(id)?.setSelectionRange(pos,pos);return;}
 if(node.dataset.basic){basicSettings[node.dataset.basic]=node.type==='checkbox'?node.checked:Number(node.value);basicDirty=true;}
 if(node.dataset.draftField){ui.draft.rows[Number(node.dataset.row)][node.dataset.draftField]=node.value;}
});
app.addEventListener('change',event=>{
 const node=event.target;
 if(node.id==='preferences-enabled'){preferenceState.document.enabled=node.checked;preferenceDirty=true;}
 if(node.name==='selected-term'){if(node.checked)ui.selectedTerms.add(Number(node.value));else ui.selectedTerms.delete(Number(node.value));render();}
 if(node.id==='select-visible-terms'){for(const {index} of visibleTerms(byId(ui.library)))if(node.checked)ui.selectedTerms.add(index);else ui.selectedTerms.delete(index);render();}
 if(node.dataset.draftField||node.dataset.draftResolution!==undefined){if(node.dataset.draftResolution!==undefined){const row=ui.draft.rows[Number(node.dataset.draftResolution)];row.resolution=node.value;row.included=node.value==='update';}prepareDraft(byId(ui.draft.libraryId),ui.draft.rows,ui.draft.origin);render();}
 if(node.id==='select-draft'){for(const row of ui.draft.rows)if(!row.problem&&row.status!=='duplicate'&&row.resolution!=='skip')row.included=node.checked;render();}
});
app.addEventListener('submit',async event=>{
 if(event.target.id==='basic-form'){event.preventDefault();if(await savePageDraft()){nativeToast('已保存');render();}}
 if(event.target.id==='surface-form'){event.preventDefault();basicSettings=await nativeCall('basic-settings',{values:{surfaceMode:new FormData(event.target).get('surfaceMode')}});basicSaved={...basicSettings};nativeToast('已保存');}
});
app.addEventListener('click',async event=>{
 const node=event.target.closest('[data-action]');if(!node)return;const {action,value}=node.dataset;
 if(action==='add-preference')document.getElementById('new-preference-dialog').showModal();
 if(action==='close-new-preference')document.getElementById('new-preference-dialog').close();
 if(action==='edit-preference'){ui.preferenceEdit=value;render();}
 if(action==='global-preference'){const rule=preferenceState.document.rules.find(row=>row.id===value);trashPrompt('更改适用范围','将这条旧场景规则改为适用于该语言方向的所有内容？','确认更改',()=>{rule.scope='';preferenceDirty=true;render();});}
 if(action==='cancel-preferences'){await discardPageDraft();render();}
 if(action==='cancel-retention'){Object.assign(retentionDraft,savedRetention);render();}
 if(action==='cancel-basic'){basicSettings={...basicSaved};basicDirty=false;render();}
 if(action==='translation-config')openNativePage('models/translation');
 if(action==='length-help')showInfo('长度计数','<p>英文等有空格的内容按词计数；中日韩文字按字近似计数。框选结果从翻译完成后计时，鼠标停留或编辑时暂停。</p>');
 if(action==='select-combo')requestCombo(value);
 if(action==='cancel-combination'){ui.comboDrafts.delete(preset().id);render();}
 if(action==='activate-combination'){if(await guardNavigation()){model.active=value;await persist('已用于翻译');}}
 if(action==='draft-filter'){ui.draftFilter=value;render();}
 if(action==='draft-direction'){const direction=document.getElementById('draft-batch-direction').value;for(const row of ui.draft.rows){row.direction=direction;row.invalidLanguage=false;}prepareDraft(byId(ui.draft.libraryId),ui.draft.rows,ui.draft.origin);render();}
 if(action==='repair-term-states'){
   const rows=invalidTermStates();if(!rows.length)return;
   trashPrompt('修正词条状态','将停用 '+rows.length+' 项状态异常的词条记录（含历史版本）。原词和译文会保留。','修正',async()=>{
     for(const term of rows)term.enabled=false;
     await persist('已修正词条状态');
   });
 }
 if(action==='term-detail'){const row=byId(ui.library).terms[Number(value)];showInfo('词条详情','<dl><dt>原词</dt><dd>'+esc(row.source)+'</dd><dt>译法</dt><dd>'+esc(row.target)+'</dd><dt>来源</dt><dd>'+esc(row.reference||row.origin||'手动')+'</dd><dt>备注</dt><dd>'+esc(row.note||'—')+'</dd></dl>');}
 if(action==='export-library'){await nativeCall('export-library',{id:value});}
 if(['enable-terms','disable-terms','delete-terms'].includes(action)){
   const library=byId(ui.library),indices=visibleTerms(library).filter(row=>ui.selectedTerms.has(row.index)).map(row=>row.index);if(!indices.length)return;
   const apply=async()=>{const versions=history(library);if(action==='delete-terms')library.terms=library.terms.filter((_,index)=>!indices.includes(index));else for(const index of indices)library.terms[index].enabled=action==='enable-terms';recordVersion(library,versions,action==='delete-terms'?'批量删除词条':action==='enable-terms'?'批量启用词条':'批量停用词条',indices.length);ui.selectedTerms.clear();await persist('已处理 '+indices.length+' 条');};
   if(action==='delete-terms')trashPrompt('删除所选词条','删除 '+indices.length+' 条词条？可以通过知识库版本记录恢复。','删除',apply);else await apply();
 }
 if(action==='batch-restore'){
   const records=value==='library'?model.libraries:model.presets,items=records.filter(row=>row.deletedAt&&normalize(row.name).includes(normalize(ui.trashSearch)));
   trashPrompt('批量恢复','选择要恢复的内容','下一步',ids=>{
     const picked=items.filter(row=>ids.includes(row.id)),children=value==='combo'?[...new Map(picked.flatMap(row=>row.ids.map(byId).filter(lib=>lib?.deletedAt)).map(lib=>[lib.id,lib])).values()]:[];
     const restore=selected=>{for(const row of picked){delete row.deletedAt;if(value==='combo')row.ids=row.ids.filter(byId);}for(const library of children)if(selected.includes(library.id))delete library.deletedAt;finishTrash('已恢复 '+picked.length+' 项');};
     if(children.length)trashPrompt('恢复包含的知识库','勾选随组合一起恢复的知识库','确认恢复',restore,{items:children,selected:true});else restore([]);
   },{items,requireSelection:true});
 }
 if(action==='storage-refresh')await refreshStorage();
 if(action==='storage-directory'||action==='storage-reset'){readyModels=await nativeCall('download-directory',{reset:action==='storage-reset'});frame.contentWindow.syncNativeModels?.(readyModels);storageState=null;render();}
 if(action==='storage-clean')trashPrompt('清理未完成下载','仅删除当前模型目录内未完成的 .download 文件，保留完整模型。','清理',async()=>{await nativeCall('clean-downloads');await refreshStorage();});
 if(action==='storage-migrate')trashPrompt('迁移已有模型','选择新文件夹后，复制并校验简译管理的模型，成功后切换路径；原文件保留。','选择新位置',async()=>{const state=await nativeCall('migrate-models');if(state){readyModels=state;frame.contentWindow.syncNativeModels?.(state);storageState=null;render();}});
 if(action==='export-backup'){const message=await nativeCall('export-backup');if(message)nativeToast(message);}
 if(action==='preview-backup'){backupPreview=null;render();backupPreview=await nativeCall('preview-backup');render();}
 if(action==='cancel-backup'){backupPreview=null;render();}
 if(action==='restore-backup')trashPrompt('恢复用户数据','将替换知识库、组合、偏好与基础设置，并先保存当前数据恢复点。模型文件和 API Key 保留。','确认恢复',async()=>{await nativeCall('restore-backup');backupPreview=null;await bootstrapNative();openPage('backup');nativeToast('已恢复，原数据恢复点已保存');});
});

for(const title of document.querySelectorAll('.nav>li>.nav-title')){
 const control=document.createElement('button');control.type='button';control.className='nav-title';control.id=title.id;control.textContent=title.textContent;control.setAttribute('aria-expanded','false');const list=title.nextElementSibling;list.hidden=true;title.replaceWith(control);control.onclick=()=>{list.hidden=!list.hidden;control.setAttribute('aria-expanded',String(!list.hidden));};
}
document.addEventListener('input',event=>{const form=event.target.form;if(form&&['term-form','library-form','preset-form','new-preference'].includes(form.id))form.dataset.dirty='true';},true);
document.addEventListener('change',event=>{const form=event.target.form;if(form&&['term-form','library-form','preset-form','new-preference'].includes(form.id))form.dataset.dirty='true';},true);
document.addEventListener('close',event=>{if(event.target instanceof HTMLDialogElement)for(const form of event.target.querySelectorAll('form'))delete form.dataset.dirty;},true);
const unguardedOpenPage=openPage;
openPage=page=>{if(ui.page!==page&&pageDirty()){guardNavigation().then(ok=>{if(ok)unguardedOpenPage(page);});return;}unguardedOpenPage(page);};
const unguardedNativePage=window.openNativePage;
window.openNativePage=page=>{if(pageDirty()){guardNavigation().then(ok=>{if(ok)unguardedNativePage(page);});return;}unguardedNativePage(page);};
render();
bootstrapNative();
</script>
