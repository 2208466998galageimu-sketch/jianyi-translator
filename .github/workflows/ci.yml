name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Windows managed
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Thanslator.slnx --locked-mode
      - name: Build managed projects
        run: dotnet build Thanslator.slnx -c Release --no-restore -warnaserror
      - name: Test without an interactive desktop
        run: dotnet test tests/Thanslator.Tests -c Release --no-build --no-restore --filter "FullyQualifiedName!~Thanslator.Tests.UiaSelectionReaderTests"

  secrets:
    name: Secret scan
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
      - name: Scan complete Git history
        shell: pwsh
        run: |
          & (Join-Path $env:RUNNER_TEMP 'gitleaks/gitleaks.exe') git . --log-opts='--all' --redact=100 --no-banner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
